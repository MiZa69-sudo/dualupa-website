<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — DUA LUPA</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <canvas id="particles"></canvas>

    <header class="navbar">
        <a href="/" class="logo">
            <span class="logo-dot"></span>
            DUA LUPA
        </a>
        <nav>
            <a href="/">Главная</a>
            <a href="/register">Регистрация</a>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-glow"></div>

        <div class="auth-card">
            <h1 class="auth-title">ВХОД В АККАУНТ</h1>
            <p class="auth-sub">Добро пожаловать обратно</p>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" placeholder="Твой пароль" required>
                </div>

                <button type="submit" class="btn primary btn-full" id="submit-btn">
                    ВОЙТИ
                </button>

                <div id="message" class="message"></div>
            </form>

            <div class="auth-footer">
                Нет аккаунта? <a href="/register">Зарегистрироваться</a>
            </div>
        </div>
    </main>

    <script src="/particles.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const btn = document.getElementById('submit-btn');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'ОТПРАВКА...';
            message.textContent = '';
            message.className = 'message';

            const formData = new FormData(form);
            const data = {
                email: formData.get('email'),
                password: formData.get('password')
            };

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (res.ok) {
                    message.textContent = '✅ Успешно! Перенаправляем...';
                    message.className = 'message success';
                    setTimeout(() => window.location.href = '/dashboard', 800);
                } else {
                    message.textContent = '❌ ' + (result.error || 'Ошибка');
                    message.className = 'message error';
                    btn.disabled = false;
                    btn.textContent = 'ВОЙТИ';
                }
            } catch (err) {
                message.textContent = '❌ Ошибка соединения';
                message.className = 'message error';
                btn.disabled = false;
                btn.textContent = 'ВОЙТИ';
            }
        });
    </script>
</body>
</html>
